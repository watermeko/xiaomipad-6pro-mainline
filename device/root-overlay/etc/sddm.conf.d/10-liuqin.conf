# liuqin: Plasma Mobile, Wayland greeter on kwin_wayland.
#
# SDDM replaced gdm3 because GDM's greeter *is* gnome-shell: keeping gdm3 would
# have kept the whole GNOME Shell stack installed for a screen that is skipped
# on every normal boot.  SDDM is a Qt program that starts the same
# plasma-mobile.desktop session GDM started, so the session itself is unchanged.
#
# Autologin is deliberately NOT here.  The account does not exist when this
# image is built; the installer creates it and writes
# /etc/sddm.conf.d/20-autologin.conf with that account's name, so a generic
# image never carries somebody else's username.
[General]
DisplayServer=wayland
Numlock=none
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=breeze
DisableAvatarsThreshold=0

[Wayland]
# The greeter runs on the same compositor as the session, so the panel is
# brought up by code that has already been proven on this device.
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
EnableHiDPI=true
