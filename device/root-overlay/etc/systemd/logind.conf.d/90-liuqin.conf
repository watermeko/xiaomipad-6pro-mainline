# logind's default HandlePowerKey=poweroff is a desktop-tower assumption: one
# press and the machine goes down. On a tablet the power button is the wake
# button, and logind claims the event before the session ever sees it, so a
# blanked panel could not be woken by the only button the hardware has.
#
# Both actions are delegated to liuqin-power-keyd. It observes the same evdev
# stream without grabbing it, so the compositor can still wake a blanked panel.
# A short release locks the session and blanks the panel (loginctl
# lock-sessions, org.freedesktop.ScreenSaver and kscreen-doctor in
# /usr/local/libexec/liuqin-power-key-action); a 1.5 second hold opens the
# Plasma power chooser and never powers off by itself. Holding the button for
# 10-20 seconds remains the PMIC-level emergency force-off underneath it.
#
# HandleLidSwitch is the fallback, not the main path: the folio cover reaches
# PowerDevil through the same SW_LID switch, and PowerDevil holds a blocking
# handle-lid-switch inhibitor while the Plasma session runs, so logind defers
# to it there. This setting covers the boot before a session exists -- the SDDM
# greeter, a failed session, and the recovery shell -- where closing the cover
# has to put the tablet to sleep instead of leaving the SoC awake. Opening the
# cover wakes it either way: the hall GPIO is a wakeup-source in the device
# tree, so the wake does not depend on who was listening when it slept.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
