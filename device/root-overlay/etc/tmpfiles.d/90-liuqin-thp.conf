# Transparent huge pages, pinned to madvise on this tablet.
#
# The kernel this product ships is built CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y,
# so *every* anonymous mapping is offered 2 MiB pages whether or not it asked
# for them.  That is a throughput default aimed at servers; on a device with
# 6.3 GiB of MemTotal it is a memory tax, because a 2 MiB page is fully
# resident as soon as any part of it is touched and most of this session's
# processes use far less than 2 MiB.
#
# Measured on the 8 GiB unit: 1360 MB of the session was backed by huge pages,
# and the padding is visible per process -- gvfs-mtp-volume-monitor held 8.5 MB
# of anonymous memory as 8 MB of huge pages, polkitd 12.9 MB as 12 MB.  A
# freshly started plasmashell was 350 MB PSS under `always` and 331 MB when the
# same binary was restarted under `madvise`.
#
# madvise keeps the feature: an allocator that knows it wants 2 MiB pages can
# still ask for them with madvise(MADV_HUGEPAGE), which is the policy Android
# and postmarketOS ship for the same hardware.  systemd-tmpfiles applies this at
# every boot, before the session's processes exist.  The kernel's own default is
# deliberately not changed here: that needs a rebuild of the pinned kernel (see
# docs/MEMORY.md, "Transparent huge pages").
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
# The other half of the policy: khugepaged only collapses regions that asked for
# huge pages now, but its defrag setting decides how hard it tries to find a
# contiguous 2 MiB block.  Compaction on a faulting allocation is a stall the
# panel does not need on a device this size.
w /sys/kernel/mm/transparent_hugepage/khugepaged/defrag - - - - 0