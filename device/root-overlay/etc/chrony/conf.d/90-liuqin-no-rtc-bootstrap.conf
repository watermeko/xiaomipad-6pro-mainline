# The PMIC RTC is not writable by HLOS on this tablet, so a cold boot can start
# months behind real time. Ubuntu's NTS bootstrap certificate cannot pass its
# activation-time check in that state, and the default authenticated-source
# selection policy then also prevents the reachable DHCP NTP source from being
# selected. chrony provides this narrow escape hatch specifically for machines
# without a working RTC: skip certificate time checks only until the first
# successful clock update. All later NTS handshakes are checked normally.
nocerttimecheck 1

# Some networks (including the current fake-IP gateway) do not carry NTS-KE
# on TCP/4460.  Ubuntu's NTS sources remain explicitly `prefer`, but do not let
# an unreachable authenticated source prevent the reachable DHCP NTP source
# from being selected forever.  This is a deliberate security trade-off: a
# hostile network can influence the fallback clock, while a working NTS source
# is still preferred.  It does not mark the DHCP source as authenticated.
authselectmode ignore
