# Compressed swap for liuqin.  The install layout has no swap partition and no
# swapfile (the tail of the UFS belongs to the A/B slot layout, linux_home and,
# in the dual-boot layout, Android), so zram is the only swap this product can
# have.  The kernel side is CONFIG_ZRAM=y with zstd and multi-comp, see
# device/configs/liuqin-memory.config.
#
# Sizing: half of RAM, capped at 3 GiB.  The 8 GiB unit reports ~6.3 GiB of
# MemTotal after firmware reservations, so this yields a 3 GiB device; the
# desktop idle baseline is ~2.9 GiB used, and the point of the pool is to keep
# a browser-sized allocation alive instead of letting systemd-oomd kill the
# session.  Higher values trade CPU for memory that is never touched.
#
# Priority 100 keeps zram ahead of any swap device a user adds later.
[zram0]
zram-size = min(ram / 2, 3072)
compression-algorithm = zstd
swap-priority = 100
